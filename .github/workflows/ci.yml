name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test

  self-scan:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      # test-fixtures/ contains credentials and auth gaps on purpose, to
      # validate the checks themselves (see test/fixtures.test.mjs) — a
      # plain fail-on would always trip on those. .mcp-audit-baseline.json
      # is this repo's own accepted state (every current finding is either
      # an intentional fixture or already reviewed); fail-on here only
      # fires on something genuinely NEW, which is exactly what we want
      # dogfooded on our own repo.
      - name: Scan this repo with its own action
        uses: ./
        with:
          path: "."
          baseline-file: ".mcp-audit-baseline.json"
          fail-on: "critical"
